[package]
name = "dehosk-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web interface for the dehosk UPLC decompiler"

[[bin]]
name = "dehosk-web"
path = "src/main.rs"

[dependencies]
dehosk = { path = "../decompiler" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
